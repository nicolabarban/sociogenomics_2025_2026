<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <!-- DNA helix SVG background decoration -->
    <svg class="dna-bg dna-left" viewBox="0 0 80 600" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.15" stroke="#fff" stroke-width="2" fill="none">
        <path d="M20,0 Q60,50 20,100 Q-20,150 20,200 Q60,250 20,300 Q-20,350 20,400 Q60,450 20,500 Q-20,550 20,600"/>
        <path d="M60,0 Q20,50 60,100 Q100,150 60,200 Q20,250 60,300 Q100,350 60,400 Q20,450 60,500 Q100,550 60,600"/>
        <line x1="20" y1="50" x2="60" y2="50"/>
        <line x1="20" y1="100" x2="60" y2="100"/>
        <line x1="20" y1="150" x2="60" y2="150"/>
        <line x1="20" y1="200" x2="60" y2="200"/>
        <line x1="20" y1="250" x2="60" y2="250"/>
        <line x1="20" y1="300" x2="60" y2="300"/>
        <line x1="20" y1="350" x2="60" y2="350"/>
        <line x1="20" y1="400" x2="60" y2="400"/>
        <line x1="20" y1="450" x2="60" y2="450"/>
        <line x1="20" y1="500" x2="60" y2="500"/>
        <line x1="20" y1="550" x2="60" y2="550"/>
      </g>
      <g opacity="0.12" fill="#fff">
        <circle cx="20" cy="50" r="3"/><circle cx="60" cy="50" r="3"/>
        <circle cx="60" cy="100" r="3"/><circle cx="20" cy="100" r="3"/>
        <circle cx="20" cy="150" r="3"/><circle cx="60" cy="150" r="3"/>
        <circle cx="60" cy="200" r="3"/><circle cx="20" cy="200" r="3"/>
        <circle cx="20" cy="250" r="3"/><circle cx="60" cy="250" r="3"/>
        <circle cx="60" cy="300" r="3"/><circle cx="20" cy="300" r="3"/>
        <circle cx="20" cy="350" r="3"/><circle cx="60" cy="350" r="3"/>
        <circle cx="60" cy="400" r="3"/><circle cx="20" cy="400" r="3"/>
        <circle cx="20" cy="450" r="3"/><circle cx="60" cy="450" r="3"/>
        <circle cx="60" cy="500" r="3"/><circle cx="20" cy="500" r="3"/>
        <circle cx="20" cy="550" r="3"/><circle cx="60" cy="550" r="3"/>
      </g>
    </svg>

    <svg class="dna-bg dna-right" viewBox="0 0 80 600" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.15" stroke="#fff" stroke-width="2" fill="none">
        <path d="M20,0 Q60,50 20,100 Q-20,150 20,200 Q60,250 20,300 Q-20,350 20,400 Q60,450 20,500 Q-20,550 20,600"/>
        <path d="M60,0 Q20,50 60,100 Q100,150 60,200 Q20,250 60,300 Q100,350 60,400 Q20,450 60,500 Q100,550 60,600"/>
        <line x1="20" y1="50" x2="60" y2="50"/>
        <line x1="20" y1="100" x2="60" y2="100"/>
        <line x1="20" y1="150" x2="60" y2="150"/>
        <line x1="20" y1="200" x2="60" y2="200"/>
        <line x1="20" y1="250" x2="60" y2="250"/>
        <line x1="20" y1="300" x2="60" y2="300"/>
        <line x1="20" y1="350" x2="60" y2="350"/>
        <line x1="20" y1="400" x2="60" y2="400"/>
        <line x1="20" y1="450" x2="60" y2="450"/>
        <line x1="20" y1="500" x2="60" y2="500"/>
        <line x1="20" y1="550" x2="60" y2="550"/>
      </g>
      <g opacity="0.12" fill="#fff">
        <circle cx="20" cy="50" r="3"/><circle cx="60" cy="50" r="3"/>
        <circle cx="60" cy="100" r="3"/><circle cx="20" cy="100" r="3"/>
        <circle cx="20" cy="150" r="3"/><circle cx="60" cy="150" r="3"/>
        <circle cx="60" cy="200" r="3"/><circle cx="20" cy="200" r="3"/>
        <circle cx="20" cy="250" r="3"/><circle cx="60" cy="250" r="3"/>
        <circle cx="60" cy="300" r="3"/><circle cx="20" cy="300" r="3"/>
        <circle cx="20" cy="350" r="3"/><circle cx="60" cy="350" r="3"/>
        <circle cx="60" cy="400" r="3"/><circle cx="20" cy="400" r="3"/>
        <circle cx="20" cy="450" r="3"/><circle cx="60" cy="450" r="3"/>
        <circle cx="60" cy="500" r="3"/><circle cx="20" cy="500" r="3"/>
        <circle cx="20" cy="550" r="3"/><circle cx="60" cy="550" r="3"/>
      </g>
    </svg>

    <div class="header-content">
      <div class="logo-row">
        <img src="{{ '/assets/images/unibo-logo.png' | relative_url }}" alt="University of Bologna" class="unibo-logo">
      </div>
      <h1 class="site-title">Sociogenomics</h1>
      <p class="site-tagline">2025/2026 &mdash; Prof. Nicola Barban</p>
      <p class="site-subtitle">Department of Statistical Sciences &middot; University of Bologna</p>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025&ndash;2026 University of Bologna &middot; Sociogenomics Course</p>
    </div>
  </footer>

</body>
</html>
