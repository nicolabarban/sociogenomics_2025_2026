<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  {% if site.description %}<meta name="description" content="{{ site.description }}">{% endif %}

  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #222;
      background: #fff;
    }
    .page { width: 100%; padding: 2rem 3rem; box-sizing: border-box; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.4em 0 0.5em; }
    h1 { font-size: 2rem; border-bottom: 1px solid #eee; padding-bottom: 0.3em; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid #f0f0f0; padding-bottom: 0.2em; }
    h3 { font-size: 1.2rem; }
    p, ul, ol, blockquote, pre, table { margin: 0.8em 0; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.9em;
      background: #f5f5f5;
      padding: 0.15em 0.35em;
      border-radius: 3px;
    }
    pre {
      background: #f6f8fa;
      padding: 1em;
      border-radius: 6px;
      overflow-x: auto;
    }
    pre code { background: transparent; padding: 0; }
    blockquote {
      border-left: 4px solid #dfe2e5;
      color: #6a737d;
      padding: 0 1em;
      margin-left: 0;
    }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #dfe2e5; padding: 0.4em 0.8em; }
    th { background: #f6f8fa; }
    img { max-width: 100%; height: auto; }
    hr { border: 0; border-top: 1px solid #eee; margin: 2em 0; }
    .site-header { padding: 1rem 3rem; border-bottom: 1px solid #eee; background: #fafafa; }
    .site-header a { color: #222; font-weight: 600; }
    .site-footer { padding: 1.5rem 3rem; border-top: 1px solid #eee; color: #777; font-size: 0.9em; margin-top: 3rem; }
  </style>

  {% include head-custom.html %}
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>

  <main class="page">
    {{ content }}
  </main>

  <footer class="site-footer">
    {{ site.description }}
  </footer>
</body>
</html>
